AWSTemplateFormatVersion: '2010-09-09'
Description: NT548 Lab01 - step 5 security groups using nested stacks

Parameters:
  SshCidr:
    Type: String
    Description: Administrator public IPv4 address with /32 prefix
    AllowedPattern: '^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$'
    ConstraintDescription: Must be a valid IPv4 address with /32 prefix
  SshPublicKey:
    Type: String
    NoEcho: true
    Description: Existing OpenSSH public key contents
    AllowedPattern: '^ssh-(ed25519|rsa) [A-Za-z0-9+/]+={0,3}( .*)?$'
  Name:
    Type: String
    Default: nt548-lab01
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a

Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/network.yaml
      Parameters:
        Name: !Ref Name
        VpcCidr: !Ref VpcCidr
        PublicSubnetCidr: !Ref PublicSubnetCidr
        PrivateSubnetCidr: !Ref PrivateSubnetCidr
        AvailabilityZone: !Ref AvailabilityZone

  RoutingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/routing.yaml
      Parameters:
        Name: !Ref Name
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        InternetGatewayId: !GetAtt NetworkStack.Outputs.InternetGatewayId

  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: templates/security.yaml
      Parameters:
        Name: !Ref Name
        VpcId: !GetAtt NetworkStack.Outputs.VpcId
        SshCidr: !Ref SshCidr

  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: RoutingStack
    Properties:
      TemplateURL: templates/compute.yaml
      Parameters:
        Name: !Ref Name
        PublicSubnetId: !GetAtt NetworkStack.Outputs.PublicSubnetId
        PrivateSubnetId: !GetAtt NetworkStack.Outputs.PrivateSubnetId
        PublicSecurityGroupId: !GetAtt SecurityStack.Outputs.PublicSecurityGroupId
        PrivateSecurityGroupId: !GetAtt SecurityStack.Outputs.PrivateSecurityGroupId
        SshPublicKey: !Ref SshPublicKey

Outputs:
  VpcId:
    Value: !GetAtt NetworkStack.Outputs.VpcId
  DefaultSecurityGroupId:
    Value: !GetAtt NetworkStack.Outputs.DefaultSecurityGroupId
  PublicRouteTableId:
    Value: !GetAtt RoutingStack.Outputs.PublicRouteTableId
  PrivateRouteTableId:
    Value: !GetAtt RoutingStack.Outputs.PrivateRouteTableId
  NatGatewayId:
    Value: !GetAtt RoutingStack.Outputs.NatGatewayId
  NatElasticIp:
    Value: !GetAtt RoutingStack.Outputs.NatElasticIp
  PublicEc2Ip:
    Value: !GetAtt ComputeStack.Outputs.PublicIp
  PrivateEc2Ip:
    Value: !GetAtt ComputeStack.Outputs.PrivateIp
