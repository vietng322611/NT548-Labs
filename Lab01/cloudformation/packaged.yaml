AWSTemplateFormatVersion: '2010-09-09'
Description: NT548 Lab01 - step 5 security groups using nested stacks
Parameters:
  SshCidr:
    Type: String
    Description: Administrator public IPv4 address with /32 prefix
    AllowedPattern: 
      ^((25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])\.){3}(25[0-5]|2[0-4][0-9]|1[0-9]{2}|[1-9]?[0-9])/32$
    ConstraintDescription: Must be a valid IPv4 address with /32 prefix
  SshPublicKey:
    Type: String
    NoEcho: true
    Description: Existing OpenSSH public key contents
    AllowedPattern: ^ssh-(ed25519|rsa) [A-Za-z0-9+/]+={0,3}( .*)?$
  Name:
    Type: String
    Default: nt548-lab01
  VpcCidr:
    Type: String
    Default: 10.0.0.0/16
  PublicSubnetCidr:
    Type: String
    Default: 10.0.1.0/24
  PrivateSubnetCidr:
    Type: String
    Default: 10.0.2.0/24
  AvailabilityZone:
    Type: AWS::EC2::AvailabilityZone::Name
    Default: us-east-1a
Resources:
  NetworkStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/nt548-lab01-cfn-398654539858/nt548-lab01/b59c401f9dfed3140b1548b0c2ab975d.template
      Parameters:
        Name:
          Ref: Name
        VpcCidr:
          Ref: VpcCidr
        PublicSubnetCidr:
          Ref: PublicSubnetCidr
        PrivateSubnetCidr:
          Ref: PrivateSubnetCidr
        AvailabilityZone:
          Ref: AvailabilityZone
  RoutingStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/nt548-lab01-cfn-398654539858/nt548-lab01/367c276a2399c247f32ec37380b455d1.template
      Parameters:
        Name:
          Ref: Name
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetId
        PrivateSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PrivateSubnetId
        InternetGatewayId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.InternetGatewayId
  SecurityStack:
    Type: AWS::CloudFormation::Stack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/nt548-lab01-cfn-398654539858/nt548-lab01/8434b0643c712d62b07ca390dd6f7cd8.template
      Parameters:
        Name:
          Ref: Name
        VpcId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.VpcId
        SshCidr:
          Ref: SshCidr
  ComputeStack:
    Type: AWS::CloudFormation::Stack
    DependsOn: RoutingStack
    Properties:
      TemplateURL: 
        https://s3.us-east-1.amazonaws.com/nt548-lab01-cfn-398654539858/nt548-lab01/e598c5d104e267e872d1bc76f6f40d64.template
      Parameters:
        Name:
          Ref: Name
        PublicSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PublicSubnetId
        PrivateSubnetId:
          Fn::GetAtt:
          - NetworkStack
          - Outputs.PrivateSubnetId
        PublicSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.PublicSecurityGroupId
        PrivateSecurityGroupId:
          Fn::GetAtt:
          - SecurityStack
          - Outputs.PrivateSecurityGroupId
        SshPublicKey:
          Ref: SshPublicKey
Outputs:
  VpcId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.VpcId
  DefaultSecurityGroupId:
    Value:
      Fn::GetAtt:
      - NetworkStack
      - Outputs.DefaultSecurityGroupId
  PublicRouteTableId:
    Value:
      Fn::GetAtt:
      - RoutingStack
      - Outputs.PublicRouteTableId
  PrivateRouteTableId:
    Value:
      Fn::GetAtt:
      - RoutingStack
      - Outputs.PrivateRouteTableId
  NatGatewayId:
    Value:
      Fn::GetAtt:
      - RoutingStack
      - Outputs.NatGatewayId
  NatElasticIp:
    Value:
      Fn::GetAtt:
      - RoutingStack
      - Outputs.NatElasticIp
  PublicEc2Ip:
    Value:
      Fn::GetAtt:
      - ComputeStack
      - Outputs.PublicIp
  PrivateEc2Ip:
    Value:
      Fn::GetAtt:
      - ComputeStack
      - Outputs.PrivateIp
