AWSTemplateFormatVersion: '2010-09-09'
Description: NT548 Lab01 routing resources

Parameters:
  Name:
    Type: String
  VpcId:
    Type: AWS::EC2::VPC::Id
  PublicSubnetId:
    Type: AWS::EC2::Subnet::Id
  PrivateSubnetId:
    Type: AWS::EC2::Subnet::Id
  InternetGatewayId:
    Type: String

Resources:
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: !Sub '${Name}-public-rt' }
        - { Key: Project, Value: NT548-Lab01 }
        - { Key: ManagedBy, Value: CloudFormation }

  PublicInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGatewayId

  PublicRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnetId
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VpcId
      Tags:
        - { Key: Name, Value: !Sub '${Name}-private-rt' }
        - { Key: Project, Value: NT548-Lab01 }
        - { Key: ManagedBy, Value: CloudFormation }

  PrivateRouteTableAssociation:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnetId
      RouteTableId: !Ref PrivateRouteTable

  NatElasticIp:
    Type: AWS::EC2::EIP
    Properties:
      Domain: vpc
      Tags:
        - { Key: Name, Value: !Sub '${Name}-nat-eip' }
        - { Key: Project, Value: NT548-Lab01 }
        - { Key: ManagedBy, Value: CloudFormation }

  NatGateway:
    Type: AWS::EC2::NatGateway
    DependsOn: PublicInternetRoute
    Properties:
      AllocationId: !GetAtt NatElasticIp.AllocationId
      SubnetId: !Ref PublicSubnetId
      ConnectivityType: public
      Tags:
        - { Key: Name, Value: !Sub '${Name}-nat' }
        - { Key: Project, Value: NT548-Lab01 }
        - { Key: ManagedBy, Value: CloudFormation }

  PrivateInternetRoute:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGateway

Outputs:
  PublicRouteTableId:
    Value: !Ref PublicRouteTable
  PrivateRouteTableId:
    Value: !Ref PrivateRouteTable
  NatGatewayId:
    Value: !Ref NatGateway
  NatElasticIp:
    Value: !Ref NatElasticIp
